<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Расписание ПВГУС</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7; --t:#000; --t2:rgba(60,60,67,.62); --t3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.85); --glass-shade:rgba(0,0,0,.06);
  --fill:rgba(118,118,128,.12);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --purple:#af52de; --red:#ff3b30; --teal:#30b0c7; --gray:#8e8e93;
  --blob1:#7aa7ff; --blob2:#ff9ec7; --blob3:#ffd27a; --blob-op:.55;
  --shadow:0 10px 30px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --spring:cubic-bezier(.32,1.45,.48,1); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --t:#fff; --t2:rgba(235,235,245,.62); --t3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.5);
  --glass:rgba(44,44,50,.52); --glass-strong:rgba(44,44,50,.72); --glass-edge:rgba(255,255,255,.16); --glass-shade:rgba(0,0,0,.3);
  --fill:rgba(118,118,128,.26);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2; --red:#ff453a; --teal:#40c8e0; --gray:#98989d;
  --blob1:#2c4cff; --blob2:#b02a78; --blob3:#c86a12; --blob-op:.42;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#000; --t:#fff; --t2:rgba(235,235,245,.62); --t3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.5);
  --glass:rgba(44,44,50,.52); --glass-strong:rgba(44,44,50,.72); --glass-edge:rgba(255,255,255,.16); --glass-shade:rgba(0,0,0,.3);
  --fill:rgba(118,118,128,.26);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2; --red:#ff453a; --teal:#40c8e0; --gray:#98989d;
  --blob1:#2c4cff; --blob2:#b02a78; --blob3:#c86a12; --blob-op:.42;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,.row,.seg,.tabs,.fab{touch-action:manipulation}
html{background:#000}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ---------- живой фон (под стеклом) ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--blob-op);will-change:transform}
.bg i:nth-child(1){background:radial-gradient(circle,var(--blob1) 0,transparent 62%);left:-25vmax;top:-30vmax;animation:drift1 22s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(circle,var(--blob2) 0,transparent 62%);right:-30vmax;top:10vh;animation:drift2 26s ease-in-out infinite alternate}
.bg i:nth-child(3){background:radial-gradient(circle,var(--blob3) 0,transparent 62%);left:-10vmax;bottom:-40vmax;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,20vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(20vmax,-18vmax) scale(1.1)}}

/* ---------- стекло ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-shade),inset 0 0 0 .5px var(--glass-edge),var(--shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.12) 100%);mix-blend-mode:soft-light}
.press{transition:transform .35s var(--spring)}
.press:active{transform:scale(.96);transition-duration:.12s}

/* ---------- каркас ---------- */
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;transition:transform .55s var(--ease),border-radius .55s var(--ease),filter .55s var(--ease);transform-origin:50% 0}
body.sheet-open #app{transform:scale(.93) translateY(calc(env(safe-area-inset-top) + 10px));border-radius:22px;overflow:hidden;filter:brightness(.82)}
.page{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 52px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 120px) max(16px,env(safe-area-inset-left))}

/* навбар: сворачивающийся большой заголовок */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top) 12px 0;height:calc(env(safe-area-inset-top) + 48px);display:flex;align-items:center;justify-content:center}
.nav .bar{position:absolute;inset:0;opacity:0;transition:opacity .3s var(--ease);background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:0 .5px 0 var(--sep)}
.nav.scrolled .bar{opacity:1}
.nav .mid{position:relative;font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:all .35s var(--ease)}
.nav.scrolled .mid{opacity:1;transform:none}
.nav .grp{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 7px);height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--blue)}
.nav .grp svg{width:14px;height:14px}

.view{display:none}
.view.on{display:block;animation:viewIn .5s var(--ease) backwards}
.view.on.back{animation-name:viewInBack}
@keyframes viewIn{from{opacity:0;transform:translateX(28px) scale(.985);filter:blur(4px)}}
@keyframes viewInBack{from{opacity:0;transform:translateX(-28px) scale(.985);filter:blur(4px)}}

.large{font-size:34px;font-weight:700;letter-spacing:.005em;margin:6px 4px 0;transform-origin:0 50%;will-change:transform}
.subtitle{font-size:15px;color:var(--t2);margin:2px 4px 16px;font-variant-numeric:tabular-nums}

/* ---------- карточка «Сейчас» ---------- */
.live{border-radius:28px;padding:18px 18px 16px;overflow:hidden}
.live .lbl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent,var(--green))}
.live .lbl .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
.live h2{margin:9px 0 4px;font-size:22px;line-height:1.18;font-weight:700;letter-spacing:-.01em}
.live .meta{font-size:14px;color:var(--t2)}
.live .row2{display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;gap:12px}
.count{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.count small{font-size:15px;font-weight:600;color:var(--t2);letter-spacing:0}
.count .num{display:inline-block}
.count .num.tick{animation:tick .6s var(--spring)}
@keyframes tick{from{transform:translateY(60%);opacity:0;filter:blur(3px)}}
.until{font-size:14px;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.until b{display:block;color:var(--t);font-size:16px}
.prog{height:7px;border-radius:7px;background:var(--fill);margin-top:14px;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent,var(--green));transition:width 1s var(--ease);overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.live .nextup{margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:14px;color:var(--t2);display:flex;gap:6px;align-items:center}
.live .nextup b{color:var(--t);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- списки ---------- */
.sec{font-size:13px;color:var(--t2);text-transform:uppercase;letter-spacing:.03em;margin:22px 18px 7px;font-weight:500}
.list{border-radius:22px;overflow:hidden}
.row{display:block;width:100%;text-align:left;position:relative;padding:12px 16px}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
.row .line{display:flex;align-items:center;gap:13px}
.row .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px color-mix(in srgb,var(--c) 35%,transparent)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .3s var(--ease)}
.row .tx span{display:block;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font-size:15px;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.row .rt small{display:block;font-size:12px;color:var(--t3)}
.row .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.row .more>div{overflow:hidden;padding-left:45px}
.row.open .more{grid-template-rows:1fr}
.row.open .tx b{white-space:normal}
.row .det{padding-top:10px;display:grid;gap:6px;font-size:14px;color:var(--t2)}
.row .det div{display:flex;gap:8px;align-items:center}
.row .det svg{width:15px;height:15px;flex:none;opacity:.8}
.row.live-row .rt{color:var(--green);font-weight:600}
.row.done{opacity:.5}
.anim .row,.anim .live,.anim .sec,.anim .empty{animation:rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
.empty{border-radius:22px;padding:34px 20px;text-align:center;color:var(--t2);font-size:15px;line-height:1.45}
.empty .e{font-size:40px;margin-bottom:8px;display:block}
.sk{height:66px;border-radius:18px;margin-bottom:10px;background:var(--fill);animation:skel 1.4s ease-in-out infinite}
@keyframes skel{50%{opacity:.45}}

/* ---------- неделя ---------- */
.weekhead{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.weekhead .subtitle{margin:0}
.arrows{display:flex;gap:8px}
.arrows button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.arrows svg{width:16px;height:16px}
.seg{position:relative;display:grid;grid-template-columns:repeat(6,1fr);padding:4px;border-radius:20px}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 6);border-radius:16px;background:var(--glass-strong);box-shadow:0 4px 14px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge);transition:transform .55s var(--spring)}
.seg button{position:relative;z-index:1;padding:7px 0 6px;text-align:center;line-height:1.1;transition:color .3s}
.seg .dw{font-size:11px;color:var(--t2);text-transform:uppercase;font-weight:600;letter-spacing:.03em}
.seg .dn{font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.seg .today .dn{color:var(--blue)}
.seg .dots{height:5px;display:flex;justify-content:center;gap:2px;margin-top:3px}
.seg .dots i{width:4px;height:4px;border-radius:50%;background:var(--t3)}
.seg .on .dots i{background:var(--blue)}
.daytitle{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.daytitle h3{margin:0;font-size:22px;font-weight:700}
.daytitle span{font-size:14px;color:var(--t2)}
#weekList.out-l{animation:outL .18s ease-in both}#weekList.out-r{animation:outR .18s ease-in both}
#weekList.in-l{animation:inL .5s var(--spring) both}#weekList.in-r{animation:inR .5s var(--spring) both}
@keyframes outL{to{opacity:0;transform:translateX(-40px)}}@keyframes outR{to{opacity:0;transform:translateX(40px)}}
@keyframes inL{from{opacity:0;transform:translateX(40px)}}@keyframes inR{from{opacity:0;transform:translateX(-40px)}}

/* ---------- плавающий таб-бар ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:20;display:flex;justify-content:center;gap:10px;pointer-events:none}
.tabs{pointer-events:auto;display:flex;padding:4px;border-radius:32px;position:relative;transition:transform .5s var(--spring)}
.tabs .sel{position:absolute;top:4px;bottom:4px;left:4px;width:96px;border-radius:28px;background:var(--fill);transition:transform .55s var(--spring),width .5s var(--spring)}
.tabs button{position:relative;width:96px;height:54px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--t);transition:color .3s,width .5s var(--spring),height .5s var(--spring)}
.tabs button.on{color:var(--blue)}
.tabs svg{width:25px;height:25px;transition:transform .5s var(--spring)}
.tabs button.on svg{transform:scale(1.08)}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--t);transition:transform .5s var(--spring)}
.fab svg{width:24px;height:24px}
.dock.mini .tabs{transform:scale(.86) translateY(6px)}
.dock.mini .tabs button span{opacity:0}
.dock.mini .fab{transform:scale(.86) translateY(6px)}
.tabs button span{transition:opacity .25s}

/* ---------- шторка выбора группы ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;height:calc(100dvh - env(safe-area-inset-top) - 28px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .6s var(--spring);background:var(--glass-strong)}
body.sheet-open .sheet{transform:none}
.sheet.dragging{transition:none}
.grab{width:38px;height:5px;border-radius:5px;background:var(--t3);margin:8px auto 4px}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px}
.sh-head b{font-size:17px}
.sh-head button{color:var(--blue);font-size:17px;min-width:70px;text-align:left}
.sh-head button:last-child{text-align:right;font-weight:600}
.search{margin:0 16px 6px;display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:12px;height:38px;padding:0 10px;color:var(--t2)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;border:0;background:transparent;color:var(--t);font:inherit;font-size:17px;outline:none;min-width:0;-webkit-user-select:text;user-select:text}
.sh-body{flex:1;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.sh-body .sec{margin-left:14px}
.gl{border-radius:16px;overflow:hidden;background:var(--glass)}
.gl button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 16px;font-size:17px;position:relative;text-align:left}
.gl button+button::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.gl button:active{background:var(--fill)}
.gl .ck{color:var(--blue);font-weight:700;opacity:0;transform:scale(.4);transition:all .4s var(--spring)}
.gl .sel .ck{opacity:1;transform:none}
.gl .nd{font-size:13px;color:var(--t3)}

/* ---------- тосты ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:40;transform:translate(-50%,-140%);padding:10px 16px;border-radius:22px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);transition:transform .6s var(--spring)}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--blue);font-weight:600}
.foot{text-align:center;font-size:12px;color:var(--t3);margin-top:26px;line-height:1.5}

/* ---------- экран ключа доступа ---------- */
.lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transition:opacity .5s var(--ease),transform .6s var(--ease)}
.lock[hidden]{display:none}
.lock.bye{opacity:0;transform:scale(1.06);pointer-events:none}
body.locked #app,body.locked .dock{filter:blur(18px);opacity:.35;pointer-events:none}
#app,.dock{transition:filter .6s var(--ease),opacity .6s var(--ease)}
.lk-card{width:100%;max-width:380px;border-radius:32px;padding:28px 22px 22px;text-align:center;animation:rise .8s var(--spring) backwards}
.lk-icon{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#5e5ce6,#007aff);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px rgba(0,122,255,.35)}
.lk-icon svg{width:34px;height:34px}
.lk-card h2{margin:0;font-size:24px;font-weight:700}
.lk-card p{margin:6px 0 20px;color:var(--t2);font-size:15px;line-height:1.4}
.lk-in{width:100%;height:54px;border-radius:16px;border:0;outline:none;background:var(--fill);color:var(--t);font:inherit;font-size:20px;font-weight:600;letter-spacing:.12em;text-align:center;text-transform:uppercase;-webkit-user-select:text;user-select:text;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .3s}
.lk-in:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.lk-in::placeholder{color:var(--t3);letter-spacing:.08em;font-weight:500}
.lk-err{height:20px;margin:8px 0 6px;font-size:14px;color:var(--red);opacity:0;transition:opacity .25s}
.lk-err.on{opacity:1}
.lk-btn{width:100%;height:52px;border-radius:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px color-mix(in srgb,var(--blue) 35%,transparent)}
.lk-btn:disabled{opacity:.5}
.lk-hint{margin-top:14px;font-size:13px;color:var(--t3)}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.lk-ok .lk-icon{background:linear-gradient(145deg,#34c759,#30b0c7);transition:background .4s}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="app">
  <div class="nav" id="nav">
    <div class="bar"></div>
    <div class="mid" id="navTitle">Сегодня</div>
    <button class="grp glass press" id="groupBtn" aria-label="Сменить группу"><span id="groupName">—</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="page">
    <!-- СЕГОДНЯ -->
    <section class="view on" id="vToday">
      <h1 class="large" id="todayLarge">Сегодня</h1>
      <div class="subtitle" id="todayDate"></div>
      <div id="todayBody"></div>
    </section>

    <!-- НЕДЕЛЯ -->
    <section class="view" id="vWeek">
      <h1 class="large">Неделя</h1>
      <div class="weekhead">
        <div class="subtitle" id="weekLabel"></div>
        <div class="arrows">
          <button class="glass press" id="prevW" aria-label="Предыдущая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="glass press" id="nextW" aria-label="Следующая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
      <div class="seg glass" id="seg"><div class="pill" id="pill"></div></div>
      <div class="daytitle"><h3 id="dayTitle"></h3><span id="dayCount"></span></div>
      <div id="weekList"></div>
    </section>

    <div class="foot" id="foot"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="tabs glass" id="tabs">
    <div class="sel" id="tabSel"></div>
    <button class="on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg><span>Сегодня</span></button>
    <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Неделя</span></button>
  </div>
  <button class="fab glass press" id="fab" aria-label="Выбрать группу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-label="Выбор группы">
  <div class="grab"></div>
  <div class="sh-head"><button id="shCancel">Отмена</button><b>Группа</b><button id="shDone">Готово</button></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Поиск" autocomplete="off" enterkeyhint="search"></label>
  <div class="sh-body" id="groups"></div>
</div>

<div class="toast glass" id="toast"></div>

<div class="lock" id="lock" hidden>
  <form class="lk-card glass" id="lkForm" autocomplete="off">
    <div class="lk-icon" id="lkIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg></div>
    <h2>Ключ доступа</h2>
    <p>Введи ключ, который тебе выдали, чтобы открыть расписание</p>
    <input class="lk-in" id="lkIn" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="40">
    <div class="lk-err" id="lkErr">Неверный ключ</div>
    <button class="lk-btn press" id="lkBtn" type="submit">Открыть</button>
    <div class="lk-hint">Нет ключа? Напиши автору приложения</div>
  </form>
</div>

<script src="access.js"></script>
<script>
// Группы колледжа (СПО) с lk.tolgas.ru/public-schedule
const GROUPS = ["СПБС25","СПБС26","СПБУ26","СПБУз23","СПБУз24","СПБУз24с","СПБУз25","СПБУз25с","СПБУз26","СПБУз26с","СПД23","СПДГ231","СПДГ232","СПДГ24","СПДГ25","СПДГ26","СПДГ26с","СПИС231","СПИС232","СПИС241","СПИС242","СПИС24с","СПИС251","СПИС252","СПИС25с","СПИСоз22","СПИСоз23","СПИСоз23с","СПКС23","СПКС24","СПКС25","СПКС26","СПКТ26","СПНА26с","СПП24","СПП25","СПП25с","СПП26","СПП26с","СППз23","СППз25","СППз26","СППз26с","СППО261","СППО262","СППО263","СПСА23","СПСА24","СПСА25","СПСА26","СПСА26с","СПТР24","СПТР251","СПТР252","СПТР25с","СПТР261","СПТР262","СПТР26с","СПТРз23","СПТРз24с","СПУК24","СПУК25","СПУК26"];
const DIRS = {СПБС:"Банковское дело",СПБУ:"Бухгалтерский учёт",СПД:"Дизайн",СПДГ:"Дизайн",СПИС:"Информационные системы",СПКС:"Компьютерные системы",СПКТ:"Компьютерные технологии",СПНА:"Направление НА",СПП:"Право",СППО:"Программирование",СПСА:"Сетевое администрирование",СПТР:"Туризм",СПУК:"Управление качеством"};
const TYPE = {lec:["Лекция","var(--blue)"],prac:["Практика","var(--orange)"],lab:["Лабораторная","var(--purple)"],cons:["Консультация","var(--teal)"],exam:["Экзамен","var(--red)"],other:["Занятие","var(--gray)"]};
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб"];
const DOW_FULL = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shortName = f => { const p=String(f||"").split(/\s+/); return p.length>=3 ? `${p[0]} ${p[1][0]}. ${p[2][0]}.` : (f||""); };
const fmtISO = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const day0 = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(day0(d), -((d.getDay()+6)%7));
const toM = s => { const [h,m]=s.split(":"); return h*60 + +m; };
const nowM = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const d=n%10; return n>10&&n<20?c:d===1?a:d>=2&&d<=4?b:c; };
const pairs = n => n+" "+plural(n,"пара","пары","пар");
const mins = n => n<60 ? n+" мин" : Math.floor(n/60)+" ч"+(n%60?" "+(n%60)+" мин":"");

const today = () => day0(new Date());
let state = { group:null, tab:"today", weekStart:mondayOf(new Date()), day:Math.min((new Date().getDay()+6)%7,5) };

// ---------- данные ----------
const cache = {};
async function loadGroup(g){
  if (g in cache) return cache[g];
  try { const r = await fetch("data/"+encodeURIComponent(g)+".json",{cache:"no-cache"}); cache[g] = r.ok ? await r.json() : null; }
  catch(e){ cache[g] = null; }
  return cache[g];
}
const lessonsOn = d => { const x=cache[state.group]; return (x && x.days[fmtISO(d)]) || []; };
const inRange = d => { const x=cache[state.group], s=fmtISO(d); return !!x && s>=x.from && s<=x.to; };
function nextStudyDay(from){
  for (let i=1;i<=21;i++){ const d=addDays(from,i); const ls=lessonsOn(d); if (ls.length) return [d,ls]; if(!inRange(d)) break; }
  return null;
}
const dayName = d => { const t=today(), diff=Math.round((d-t)/864e5); return diff===0?"Сегодня":diff===1?"Завтра":DOW_FULL[d.getDay()]; };
const dateStr = d => d.getDate()+" "+MONTHS[d.getMonth()];

// ---------- разметка ----------
const ICON = {
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>'
};
function rowHTML(l, i, cls=""){
  const [tl,col] = TYPE[l.type] || TYPE.other;
  const sub = [l.typeLabel||tl, l.room].filter(Boolean).join(" · ");
  const rt = cls.includes("live-row") ? "идёт" : `${l.start}<small>${l.end}</small>`;
  return `<button class="row press ${cls}" style="--i:${i};--c:${col}">
    <div class="line"><div class="n">${l.n}</div><div class="tx"><b>${esc(l.title)}</b><span>${esc(sub)}</span></div><div class="rt">${rt}</div></div>
    <div class="more"><div><div class="det">
      <div>${ICON.tag}${esc(l.typeLabel||tl)} · ${l.start}–${l.end}</div>
      ${l.teacher?`<div>${ICON.user}${esc(l.teacher)}</div>`:""}
      ${l.room?`<div>${ICON.pin}Аудитория ${esc(l.room)}</div>`:""}
      ${l.note?`<div>${ICON.info}${esc(l.note)}</div>`:""}
    </div></div></div></button>`;
}
const listHTML = (ls, i0, clsFn=()=>"") => `<div class="list glass" style="--i:${i0}">${ls.map((l,k)=>rowHTML(l,i0+k+1,clsFn(l))).join("")}</div>`;
const secHTML = (t,i) => `<div class="sec" style="--i:${i}">${esc(t)}</div>`;
function emptyHTML(){
  const x = cache[state.group];
  if (!(state.group in cache)) return `<div class="sk"></div><div class="sk"></div><div class="sk"></div>`;
  if (x === null) return `<div class="empty glass"><span class="e">📭</span>Расписание группы ${esc(state.group)} пока не загружено.<br>Загляни позже или выбери другую группу.</div>`;
  return null;
}

// ---------- экран «Сегодня» ----------
let lastCount = null;
function renderToday(animate){
  const t = today(), m = nowM();
  $("todayDate").textContent = DOW_FULL[t.getDay()]+", "+dateStr(t);
  const body = $("todayBody");
  body.classList.toggle("anim", !!animate);
  const em = emptyHTML(); if (em){ body.innerHTML = em; return; }
  const ls = lessonsOn(t);
  const cur = ls.find(l => toM(l.start)<=m && m<toM(l.end));
  const next = ls.find(l => toM(l.start)>m);
  const done = ls.filter(l => toM(l.end)<=m);
  const upcoming = ls.filter(l => toM(l.start)>m);
  $("todayDate").textContent += ls.length ? " · "+pairs(ls.length) : "";
  let card = "", count = null, i = 0;

  if (cur){
    const s=toM(cur.start), e=toM(cur.end), left=e-m, pct=Math.round((m-s)/(e-s)*100);
    const [tl] = TYPE[cur.type]||TYPE.other; count = left;
    card = `<div class="live glass" style="--i:${i++};--accent:var(--green)">
      <div class="lbl"><span class="dot"></span>Сейчас · ${cur.n} пара · ${esc(cur.typeLabel||tl)}</div>
      <h2>${esc(cur.title)}</h2>
      <div class="meta">${esc([shortName(cur.teacher), cur.room && "ауд. "+cur.room].filter(Boolean).join(" · "))}</div>
      <div class="row2"><div class="count"><span class="num" id="cnum">${left}</span><small>мин осталось</small></div><div class="until">до<b>${cur.end}</b></div></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      ${next?`<div class="nextup">Далее в ${next.start}: <b>${esc(next.title)}</b></div>`:`<div class="nextup">Это последняя пара сегодня</div>`}
    </div>`;
  } else if (next){
    const wait = toM(next.start)-m, first = !done.length;
    const [tl] = TYPE[next.type]||TYPE.other; count = wait;
    card = `<div class="live glass" style="--i:${i++};--accent:${first?"var(--blue)":"var(--orange)"}">
      <div class="lbl"><span class="dot"></span>${first?"Первая пара":"Перемена"} · ${next.n} пара · ${esc(next.typeLabel||tl)}</div>
      <h2>${esc(next.title)}</h2>
      <div class="meta">${esc([shortName(next.teacher), next.room && "ауд. "+next.room].filter(Boolean).join(" · "))}</div>
      <div class="row2"><div class="count">${wait<=180?`<small>через</small><span class="num" id="cnum">${wait}</span><small>мин</small>`:`<span class="num">${next.start}</span>`}</div><div class="until">начало<b>${next.start}</b></div></div>
    </div>`;
  } else {
    const nd = nextStudyDay(t);
    const title = ls.length ? "На сегодня всё 🎉" : "Сегодня пар нет";
    const sub = nd ? `${dayName(nd[0])}, ${dateStr(nd[0])} — ${pairs(nd[1].length)}, первая в ${nd[1][0].start}` : "Дальше в расписании пока пусто";
    card = `<div class="live glass" style="--i:${i++};--accent:var(--purple)">
      <div class="lbl"><span class="dot"></span>${ls.length?"Пары закончились":"Выходной"}</div>
      <h2>${title}</h2><div class="meta">${esc(sub)}</div></div>`;
  }

  let html = card;
  const rest = cur ? upcoming : upcoming.filter(l => l!==next);
  if (rest.length){ html += secHTML("Далее", i++) + listHTML(rest, i); i += rest.length+1; }
  if (!cur && !next){
    const nd = nextStudyDay(t);
    if (nd){ html += secHTML(dayName(nd[0])+", "+dateStr(nd[0]), i++) + listHTML(nd[1], i); i += nd[1].length+1; }
  }
  if (done.length){ html += secHTML("Прошли", i++) + listHTML(done, i, () => "done"); }
  body.innerHTML = html;
  const cn = $("cnum");
  if (cn && lastCount !== null && lastCount !== count && !animate){ cn.classList.add("tick"); }
  lastCount = count;
}

// ---------- экран «Неделя» ----------
function renderWeek(dir){
  const ws = state.weekStart, we = addDays(ws,5), t = today();
  $("weekLabel").textContent = ws.getDate()+(ws.getMonth()!==we.getMonth()?" "+MONTHS[ws.getMonth()]:"")+" – "+dateStr(we)+(+ws===+mondayOf(t)?" · эта неделя":"");
  const seg = $("seg");
  seg.querySelectorAll("button").forEach(b => b.remove());
  DOW.forEach((d,i) => {
    const dt = addDays(ws,i), n = lessonsOn(dt).length;
    const b = document.createElement("button");
    b.className = (i===state.day?"on ":"")+(+dt===+t?"today":"");
    b.dataset.i = i;
    b.innerHTML = `<div class="dw">${d}</div><div class="dn">${dt.getDate()}</div><div class="dots">${"<i></i>".repeat(Math.min(n,5))}</div>`;
    seg.appendChild(b);
  });
  $("pill").style.transform = `translateX(${state.day*100}%)`;

  const cur = addDays(ws, state.day), isT = +cur===+t;
  $("dayTitle").textContent = (isT?"Сегодня":DOW_FULL[cur.getDay()]);
  const ls = lessonsOn(cur), m = nowM();
  $("dayCount").textContent = dateStr(cur) + (ls.length?" · "+pairs(ls.length):"");
  const em = emptyHTML();
  let html;
  if (em) html = em;
  else if (!ls.length) html = `<div class="empty glass"><span class="e">${inRange(cur)?"☕️":"🗓️"}</span>${inRange(cur)?"Пар нет — можно отдыхать":"На эти даты расписания пока нет"}</div>`;
  else html = listHTML(ls, 0, l => isT && toM(l.start)<=m && m<toM(l.end) ? "live-row" : (isT && toM(l.end)<=m ? "done" : ""));
  const box = $("weekList");
  const apply = () => { box.innerHTML = html; box.classList.remove("out-l","out-r","in-l","in-r"); if (dir){ void box.offsetWidth; box.classList.add(dir>0?"in-l":"in-r"); } else { box.classList.add("anim"); } };
  if (dir && box.innerHTML){ box.classList.remove("anim","in-l","in-r"); box.classList.add(dir>0?"out-l":"out-r"); setTimeout(apply, 170); }
  else apply();
}

// ---------- общий рендер ----------
function render(animate){
  $("groupName").textContent = state.group;
  const x = cache[state.group];
  $("foot").textContent = x ? "Расписание с lk.tolgas.ru · обновлено на сайте "+(x.siteUpdated||"—") : "";
  if (state.tab==="today") renderToday(animate); else renderWeek(0);
  writeHash();
}
function setTab(tab){
  if (tab===state.tab) { scrollTo({top:0,behavior:"smooth"}); return; }
  const back = tab==="today";
  state.tab = tab;
  document.querySelectorAll(".tabs button").forEach((b,i) => { b.classList.toggle("on", b.dataset.tab===tab); if (b.dataset.tab===tab) $("tabSel").style.transform=`translateX(${i*100}%)`; });
  ["vToday","vWeek"].forEach(id => { const v=$(id); v.classList.remove("on","back"); });
  const v = $(tab==="today"?"vToday":"vWeek"); void v.offsetWidth; v.classList.add("on"); if (back) v.classList.add("back");
  $("navTitle").textContent = tab==="today" ? "Сегодня" : "Неделя";
  scrollTo({top:0});
  if (tab==="today") renderToday(true); else { $("weekList").innerHTML=""; renderWeek(0); }
  writeHash();
}

// ---------- адрес: #/группа или #/группа/ГГГГ-ММ-ДД (неделя) ----------
function readHash(){
  const [, g, d] = decodeURIComponent(location.hash).split("/");
  if (g && GROUPS.includes(g)) state.group = g;
  if (d && /^\d{4}-\d\d-\d\d$/.test(d)){ const dt=new Date(d+"T00:00"); state.weekStart=mondayOf(dt); state.day=Math.min((dt.getDay()+6)%7,5); state.tab="week"; }
}
function writeHash(){
  const h = "#/"+encodeURIComponent(state.group) + (state.tab==="week" ? "/"+fmtISO(addDays(state.weekStart,state.day)) : "");
  if (location.hash !== h) history.replaceState(null,"",h);
}

// ---------- выбор группы ----------
function renderGroups(){
  const q = $("q").value.trim().toUpperCase();
  const recent = (store.get("recent")||"").split(",").filter(g => GROUPS.includes(g));
  const btn = g => `<button class="${g===state.group?"sel":""}" data-g="${g}"><span>${g}</span><span class="ck">✓</span></button>`;
  let html = "";
  if (!q && recent.length) html += `<div class="sec">Недавние</div><div class="gl">${recent.map(btn).join("")}</div>`;
  const by = {};
  GROUPS.filter(g => g.toUpperCase().includes(q)).forEach(g => { const p=g.match(/^[А-ЯЁ]+/)[0]; (by[p]=by[p]||[]).push(g); });
  for (const p in by) html += `<div class="sec">${p}${DIRS[p]?" · "+DIRS[p]:""}</div><div class="gl">${by[p].map(btn).join("")}</div>`;
  $("groups").innerHTML = html || `<div class="empty" style="margin-top:20px">Ничего не найдено</div>`;
}
function openSheet(){ renderGroups(); document.body.classList.add("sheet-open"); $("groups").scrollTop=0; }
function closeSheet(){ document.body.classList.remove("sheet-open"); $("q").blur(); $("q").value=""; $("sheet").style.transform=""; }
function pick(g){
  state.group = g; store.set("group", g);
  store.set("recent", [g, ...(store.get("recent")||"").split(",").filter(x => x && x!==g)].slice(0,4).join(","));
  $("groups").querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.g===g));
  setTimeout(closeSheet, 180);
  lastCount = null; render(true); loadGroup(g).then(() => render(true));
}
$("groupBtn").onclick = openSheet; $("fab").onclick = openSheet;
$("scrim").onclick = closeSheet; $("shCancel").onclick = closeSheet; $("shDone").onclick = closeSheet;
$("q").oninput = renderGroups;
$("groups").onclick = e => { const b=e.target.closest("[data-g]"); if (b) pick(b.dataset.g); };
// смахнуть шторку вниз
(() => { let y0=null, dy=0; const sh=$("sheet");
  sh.addEventListener("touchstart", e => { if (e.target.closest(".sh-body") && $("groups").scrollTop>0) return; y0=e.touches[0].clientY; dy=0; sh.classList.add("dragging"); }, {passive:true});
  sh.addEventListener("touchmove", e => { if (y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); sh.style.transform=`translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener("touchend", () => { if (y0===null) return; sh.classList.remove("dragging"); y0=null; if (dy>120) closeSheet(); else sh.style.transform=""; });
})();

// ---------- события ----------
document.querySelector(".tabs").onclick = e => { const b=e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); };
document.addEventListener("click", e => { const r=e.target.closest(".row"); if (r) r.classList.toggle("open"); });
$("seg").onclick = e => { const b=e.target.closest("button"); if (!b) return; const i=+b.dataset.i; if (i===state.day) return; const dir=i>state.day?1:-1; state.day=i; renderWeek(dir); writeHash(); };
$("prevW").onclick = () => { state.weekStart=addDays(state.weekStart,-7); renderWeek(-1); writeHash(); };
$("nextW").onclick = () => { state.weekStart=addDays(state.weekStart,7); renderWeek(1); writeHash(); };
function shiftDay(dir){
  let d = state.day+dir;
  if (d<0){ d=5; state.weekStart=addDays(state.weekStart,-7); }
  if (d>5){ d=0; state.weekStart=addDays(state.weekStart,7); }
  state.day = d; renderWeek(dir); writeHash();
}
let sx=0, sy=0, st=0;
document.addEventListener("touchstart", e => { if (state.tab!=="week" || document.body.classList.contains("sheet-open")) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=1; }, {passive:true});
document.addEventListener("touchend", e => { if (!st) return; st=0; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) shiftDay(dx<0?1:-1); }, {passive:true});

// большой заголовок сворачивается, таб-бар уменьшается при прокрутке вниз
let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY;
  $("nav").classList.toggle("scrolled", y>34);
  document.querySelectorAll(".large").forEach(h => { const k=Math.max(0,Math.min(1,y/60)); h.style.transform=`scale(${1-k*0.12})`; h.style.opacity=1-k*0.9; });
  if (y<=0) h_overscroll(y);
  $("dock").classList.toggle("mini", y>lastY+2 && y>80);
  if (y<lastY-2) $("dock").classList.remove("mini");
  lastY = y;
}, {passive:true});
function h_overscroll(){ document.querySelectorAll(".large").forEach(h => { h.style.transform=""; h.style.opacity=1; }); }

// живой отсчёт
setInterval(() => { if (state.tab==="today" && !document.hidden) renderToday(false); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ if (state.tab==="today") renderToday(false); else renderWeek(0); } });
addEventListener("hashchange", () => { const g=state.group; readHash(); if (g!==state.group) loadGroup(state.group).then(() => render(true)); });

// ---------- тосты: офлайн и установка ----------
function toast(html, ms){ const t=$("toast"); t.innerHTML=html; t.classList.add("show"); clearTimeout(t._h); if (ms) t._h=setTimeout(()=>t.classList.remove("show"), ms); }
addEventListener("offline", () => toast("Нет интернета — показано сохранённое расписание", 3500));
let deferred = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred=e; if (!store.get("installHidden")) toast('Установить на главный экран? <button id="inst">Установить</button>', 9000); });
document.addEventListener("click", async e => { if (e.target.id==="inst" && deferred){ deferred.prompt(); await deferred.userChoice; deferred=null; $("toast").classList.remove("show"); store.set("installHidden","1"); } });
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !store.get("iosHint")){ setTimeout(() => toast("Поделиться → «На экран Домой», чтобы установить", 6000), 1500); store.set("iosHint","1"); }
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));

// ---------- без масштабирования (iOS игнорирует user-scalable=no) ----------
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive:false});

// ---------- ключ доступа ----------
async function keyHash(k){
  const canon = String(k).toUpperCase().replace(/[^A-Z0-9]/g, "");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(ACCESS_SALT + canon));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
async function keyValid(k){ try { return !!k && ACCESS_HASHES.has(await keyHash(k)); } catch(e){ return false; } }
function unlock(){
  const l = $("lock");
  l.classList.add("bye"); document.body.classList.remove("locked");
  setTimeout(() => { l.hidden = true; l.classList.remove("bye"); }, 600);
  render(true);
  if (!store.get("group") && !location.hash.includes("/")) setTimeout(openSheet, 700);
}
$("lkIn").addEventListener("input", e => {
  $("lkErr").classList.remove("on");
  const v = e.target.value.toUpperCase();
  if (/^[A-Z0-9]{0,12}$/.test(v.replace(/-/g,"")) && !v.startsWith("MASTER")) {
    const raw = v.replace(/[^A-Z0-9]/g,"").slice(0,12);
    e.target.value = raw.match(/.{1,4}/g)?.join("-") || "";
  }
});
$("lkForm").addEventListener("submit", async e => {
  e.preventDefault();
  const k = $("lkIn").value.trim(); if (!k) return;
  $("lkBtn").disabled = true;
  if (await keyValid(k)){
    store.set("accessKey", k);
    $("lkForm").classList.add("lk-ok"); $("lkErr").classList.remove("on");
    if (navigator.vibrate) navigator.vibrate(15);
    setTimeout(unlock, 450);
  } else {
    const f = $("lkForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    $("lkErr").classList.add("on");
    if (navigator.vibrate) navigator.vibrate([30,40,30]);
  }
  $("lkBtn").disabled = false;
});

// ---------- старт ----------
state.group = GROUPS.includes(store.get("group")) ? store.get("group") : "СПКС24";
readHash();
if (state.tab==="week"){ state.tab="today"; setTab("week"); }
loadGroup(state.group).then(() => { if (!document.body.classList.contains("locked")) render(true); });
keyValid(store.get("accessKey")).then(ok => {
  if (ok){ render(true); if (!store.get("group") && !location.hash.includes("/")) setTimeout(openSheet, 600); }
  else { document.body.classList.add("locked"); $("lock").hidden = false; setTimeout(() => $("lkIn").focus(), 400); }
});
</script>
</body>
</html>
